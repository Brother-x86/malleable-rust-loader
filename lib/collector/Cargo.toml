[package]
name = "collector"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30.0"
whoami = "1.5.2"
obfstr = "0.4"
bincode = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.45.0" , features = [
    "Win32_Foundation",
    "Win32_Networking_ActiveDirectory",
]}
